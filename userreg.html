
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopHub | Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #2b4eff;
    --ink: #0e1233;
    --sun: #ffc83d;
    --bg: #f6f7fb;
    --mut: #5d6385;
    --line: #e3e6f2;
}

body {
    font-family: 'Figtree', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

nav {
    padding: 22px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 25px;
    font-weight: 800;
}

.logo-icon {
    width: 38px;
    height: 38px;
    background: var(--blue);
    color: var(--sun);
    display: grid;
    place-items: center;
    border-radius: 10px;
    transform: rotate(-8deg);
}

.logo-icon span {
    transform: rotate(8deg);
}

.home-link {
    text-decoration: none;
    color: var(--mut);
    font-weight: 600;
}

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 20px 40px;
}

.register-card {
    width: 100%;
    max-width: 570px;
    background: white;
    padding: 40px;
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 15px 45px rgba(14,18,51,0.06);
}

.tag {
    display: inline-block;
    background: #fff5d8;
    color: #8c6400;
    padding: 7px 13px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 17px;
}

h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 34px;
    margin-bottom: 10px;
}

.subtitle {
    color: var(--mut);
    margin-bottom: 28px;
    line-height: 1.6;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group {
    margin-bottom: 18px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 9px;
}

input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    font-family: inherit;
    font-size: 14px;
    transition: 0.2s;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(43,78,255,0.1);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-btn {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: var(--blue);
    font-weight: 700;
    cursor: pointer;
}

.terms {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    color: var(--mut);
    font-size: 13px;
    line-height: 1.5;
    margin: 5px 0 22px;
}

.terms input {
    width: auto;
    margin-top: 3px;
    accent-color: var(--blue);
}

.terms a {
    color: var(--blue);
    text-decoration: none;
    font-weight: 700;
}

.register-btn {
    width: 100%;
    padding: 15px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.25s;
}

.register-btn:hover {
    background: #1839e6;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(43,78,255,0.2);
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #eef1ff;
    color: var(--blue);
    border-radius: 9px;
    text-align: center;
    font-size: 14px;
}

.bottom-text {
    text-align: center;
    margin-top: 24px;
    color: var(--mut);
    font-size: 14px;
}

.bottom-text a {
    color: var(--blue);
    text-decoration: none;
    font-weight: 700;
}

footer {
    text-align: center;
    padding: 20px;
    color: var(--mut);
    font-size: 13px;
}

@media(max-width: 600px) {
    .register-card {
        padding: 28px 22px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    h1 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        <div class="logo-icon"><span>S</span></div>
        ShopHub
    </div>

    <a href="index.html" class="home-link">← Back to Home</a>
</nav>

<main>
    <div class="register-card">

        <span class="tag">JOIN SHOPHUB</span>

        <h1>Create Your Account</h1>

        <p class="subtitle">
            Sign up today and discover a better shopping experience.
        </p>

        <form id="registerForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname"
                           placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username"
                           placeholder="Choose username" required>
                </div>

                <div class="form-group full">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="example@gmail.com" required>
                </div>

                <div class="form-group full">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                           placeholder="Enter 10 digit phone number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input type="password" id="password"
                               placeholder="Minimum 8 characters"
                               minlength="8" required>

                        <button type="button" class="show-btn"
                                onclick="togglePassword('password', this)">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-box">
                        <input type="password" id="confirmPassword"
                               placeholder="Re-enter password" required>

                        <button type="button" class="show-btn"
                                onclick="togglePassword('confirmPassword', this)">
                            Show
                        </button>
                    </div>
                </div>

            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>
                <span>
                    I agree to the ShopHub terms and conditions.
                </span>
            </label>

            <button type="submit" class="register-btn">
                Create Account →
            </button>

            <div class="message" id="message"></div>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>
</main>

<footer>
    © 2026 ShopHub. All rights reserved.
</footer>

<script>
function togglePassword(id, button) {
    const password = document.getElementById(id);

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }
}

document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    if (password !== confirmPassword) {
        message.style.display = "block";
        message.textContent = "Passwords do not match!";
        return;
    }

    message.style.display = "block";
    message.textContent = "Registration form submitted successfully!";
});
</script>

</body>
</html>
